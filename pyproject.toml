[project]
name = "ollaya-decision-gate"
version = "0.3.0"
description = "Local permission gate for OpenCode: an Ollaya decision model auto-approves routine tool calls, on your own hardware"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ollaya-decision-gate contributors" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["opencode", "permissions", "ai-safety", "ollaya", "local-llm"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit"]
test = ["pytest"]

[project.scripts]
ollaya-gate-doctor = "ollaya_gate.doctor:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
# Intentional set: pyflakes + pycodice-errors only. Blind `except` and
# `try/except/pass` are the fail-open design, not lint debt (see
# SECURITY.md), so flake8-blind-except / bandit rules stay off.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["ollaya_gate"]
